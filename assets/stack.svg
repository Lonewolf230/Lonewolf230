<title id="t">Tech stack listed as folders in a terminal: languages: python, sql, javascript, typescript, html, css; backend: fastapi, express, node.js, rest-apis; data: airflow, postgresql, mysql, mongodb, redis; ai: langgraph, weaviate; cloud: aws, docker, github-actions, supabase, firebase; frontend: react, flutter; </title>
