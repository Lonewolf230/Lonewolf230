<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="aboutTitle">
<title id="aboutTitle">Terminal window showing a short about-me paragraph</title>
<style>
  .l{animation:in .45s ease-out both}
  @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .cur{animation:blink 1.1s steps(1) infinite;animation-delay:2.6s}
  @keyframes blink{0%,100%{fill-opacity:1}50%{fill-opacity:0}}
  text{white-space:pre}
</style>
<defs>
  <clipPath id="win"><rect width="880" height="330" rx="14"/></clipPath>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity="0.14"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g clip-path="url(#win)">
<rect width="880" height="330" fill="#1a1b26"/>
<rect width="880" height="40" fill="#16161e"/>
<circle cx="26" cy="20" r="6" fill="#f7768e"/>
<circle cx="46" cy="20" r="6" fill="#e0af68"/>
<circle cx="66" cy="20" r="6" fill="#9ece6a"/>
<text x="440.0" y="25" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#565f89">manish@dev — zsh</text>
<g class="l"><text x="32" y="78" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#9ece6a">$</tspan><tspan fill="#c0caf5"> cat about.md</tspan></text></g>
<g class="l" style="animation-delay:0.35s"><text x="32" y="110" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#c0caf5">I build the plumbing behind useful software: </tspan><tspan fill="#7dcfff">data pipelines</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#7dcfff">backend APIs</tspan><tspan fill="#c0caf5">,</tspan></text></g>
<g class="l" style="animation-delay:0.53s"><text x="32" y="132" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#c0caf5">and the occasional full-stack app.</tspan></text></g>
<g class="l" style="animation-delay:0.89s"><text x="32" y="176" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#c0caf5">I like problems where messy inputs have to become something </tspan><tspan fill="#7dcfff">reliable</tspan><tspan fill="#c0caf5">, so I care</tspan></text></g>
<g class="l" style="animation-delay:1.07s"><text x="32" y="198" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#c0caf5">about </tspan><tspan fill="#7dcfff">tests</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#7dcfff">observability</tspan><tspan fill="#c0caf5">, and designs that stay boring in production.</tspan></text></g>
<g class="l" style="animation-delay:1.43s"><text x="32" y="242" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#c0caf5">Lately I&#x27;m going deep on </tspan><tspan fill="#7dcfff">AI engineering</tspan><tspan fill="#c0caf5">: retrieval, agents, and making them</tspan></text></g>
<g class="l" style="animation-delay:1.61s"><text x="32" y="264" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#c0caf5">dependable enough to trust.</tspan></text></g>
<g class="l" style="animation-delay:2.0s"><text x="32" y="302" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#9ece6a">$</tspan><tspan class="cur" fill="#7aa2f7"> █</tspan></text></g>
<rect width="880" height="330" fill="url(#scan)" pointer-events="none"/>
<rect width="880" height="330" fill="url(#vig)" pointer-events="none"/>
</g>
<rect x="0.5" y="0.5" width="879" height="329" rx="14" fill="none" stroke="#2a2e42"/>
</svg>
